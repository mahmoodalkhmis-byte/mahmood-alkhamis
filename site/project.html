  <script>

    try { var c = JSON.parse(localStorage.getItem('site-colors:' + location.pathname + location.search) || '{}'); for (var k in c) document.documentElement.style.setProperty(k, c[k]); } catch (e) {}
    // انتقال الصفحات: إذا المتصفح تخطّاه (مثلًا ضغطت بسرعة) ما يطلع خطأ في الـ Console
    ['pageswap', 'pagereveal'].forEach(function (t) { addEventListener(t, function (e) { if (e.viewTransition) e.viewTransition.ready.catch(function () {}); }); });
