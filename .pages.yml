# ==================================================================
# لوحة التحكم (Pages CMS) — تدخلها من app.pagescms.org
# هذا الملف يحدد وش يطلع في اللوحة من خانات. ما تحتاج تعدّله.
# ==================================================================

# الصور المرفوعة تنحفظ داخل site/images
# وتنكتب في ملفات المحتوى بالشكل: images/...
media:
  input: site/images
  output: images
  rename: random        # اسم عشوائي لكل صورة، عشان ما تنكتب صورة فوق صورة بنفس الاسم
  categories: [image]

settings:
  hide: true            # يخفي صفحة الإعدادات عشان ما يتغيّر هذا الملف بالغلط

content:
  # ---------------------------------------------------------------
  - name: projects
    label: المشاريع
    description: مشاريع القسمين (رياضي ومشاريع). اسحب المشروع لفوق أو لتحت عشان تغيّر ترتيبه في الموقع.
    type: file
    path: site/content/projects.json
    format: json
    fields:
      - name: projects
        label: المشاريع
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: اسم المشروع
            type: string
            required: true
          - name: id
            label: اسم الرابط (بالإنجليزي)
            description: "حروف إنجليزية صغيرة وأرقام وشرطة (-) بس، وما يتكرر بين المشاريع. مثال: riyadh-2027 — لا تغيّره بعد النشر عشان الروابط القديمة تبقى شغالة."
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
              message: "حروف إنجليزية صغيرة وأرقام وشرطة (-) بس، بدون مسافات"
          - name: category
            label: القسم
            type: select
            required: true
            options:
              values:
                - name: sport
                  label: رياضي
                - name: story
                  label: مشاريع
          - name: subtitle
            label: سطر تعريفي (اختياري)
            type: string
          - name: location
            label: المكان
            type: string
          - name: year
            label: السنة (اختياري)
            type: string
          - name: featured
            label: يظهر في الصفحة الرئيسية
            type: boolean
          - name: cover
            label: صورة الغلاف
            description: تنقص مربع في صفحة القسم، وتطلع كاملة فوق في صفحة المشروع.
            type: image
            required: true
            options:
              path: site/images/projects
          - name: coverPosition
            label: موضع الغلاف داخل المربع (اختياري)
            description: "استخدمه إذا المربع قاطع الوجه. 50% 50% = الوسط، 80% 50% = يميل لليمين، 20% 50% = لليسار، 50% 20% = لفوق."
            type: string
          - name: description
            label: الوصف
            description: كل سطر جديد = فقرة جديدة.
            type: text
          - name: photos
            label: صور المشروع
            description: تقدر ترفع أكثر من صورة مرة وحدة. تطلع في الموقع بنفس الترتيب اللي هنا.
            type: image
            options:
              multiple: true
              path: site/images/projects

  # ---------------------------------------------------------------
  - name: site
    label: نصوص الموقع
    description: الصفحة الرئيسية، نبذة الأقسام، نبذة عني، وبيانات التواصل.
    type: file
    path: site/content/site.json
    format: json
    fields:
      - name: hero
        label: الصفحة الرئيسية
        type: object
        fields:
          - name: title
            label: الاسم الكبير
            description: كل سطر هنا = سطر في العنوان.
            type: text
          - name: role
            label: المسمى
            type: string
          - name: lead
            label: الجملة التعريفية
            type: text
          - name: photo
            label: الصورة الشخصية
            type: image
            options:
              path: site/images

      - name: sections
        label: نبذة الأقسام
        type: object
        fields:
          - name: sport
            label: قسم رياضي
            type: object
            fields:
              - name: label
                label: العنوان الإنجليزي الصغير
                type: string
              - name: intro
                label: النبذة تحت العنوان
                type: text
          - name: story
            label: قسم مشاريع
            type: object
            fields:
              - name: label
                label: العنوان الإنجليزي الصغير
                type: string
              - name: intro
                label: النبذة تحت العنوان
                type: text

      - name: about
        label: نبذة عني
        type: object
        fields:
          - name: lead
            label: الفقرة الأولى (بخط أكبر)
            type: text
          - name: body
            label: باقي النبذة
            description: كل سطر جديد = فقرة جديدة.
            type: text
          - name: facts
            label: الأرقام
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{fields.value}"
            fields:
              - name: value
                label: الرقم
                description: "مثال: +6 سنوات"
                type: string
              - name: text
                label: الوصف تحته
                type: string
          - name: tags
            label: الوسوم
            type: string
            list: true
          - name: photo
            label: الصورة
            type: image
            options:
              path: site/images

      - name: contact
        label: تواصل معي
        description: البريد و LinkedIn يتغيّرون في كل الموقع (حتى أسفل الصفحات).
        type: object
        fields:
          - name: title
            label: العنوان
            type: string
          - name: intro
            label: الجملة تحت العنوان
            type: text
          - name: email
            label: البريد
            type: string
          - name: phone
            label: الجوال / واتساب
            description: "اكتبه مع مفتاح الدولة، مثال: +966 54 235 5887 (رابط واتساب يتسوّى منه تلقائيًا). اتركه فاضي إذا ما تبيه يظهر."
            type: string
          - name: linkedin
            label: رابط LinkedIn
            type: string
          - name: location
            label: الموقع
            type: string
