# ==================================================================
# لوحة التحكم (Pages CMS) — تدخلها من app.pagescms.org
# أو من رابط الموقع: mahmood-alkhamis.netlify.app/admin
# هذا الملف يحدد وش يطلع في اللوحة من خانات. ما تحتاج تعدّله.
# ==================================================================

# الصور المرفوعة تنحفظ داخل site/images
# وتنكتب في ملفات المحتوى بالشكل: images/...
media:
  input: site/images
  output: images
  rename: random        # اسم عشوائي لكل صورة، عشان ما تنكتب صورة فوق صورة بنفس الاسم
  categories: [image]

settings:
  hide: true            # يخفي صفحة الإعدادات عشان ما يتغيّر هذا الملف بالغلط

content:
  # ---------------------------------------------------------------
  - name: projects
    label: الأقسام والمشاريع
    description: كل قسم يطلع في القائمة فوق، وداخله مشاريعه. اسحب أي قسم أو مشروع لفوق أو لتحت عشان تغيّر ترتيبه.
    type: file
    path: site/content/projects.json
    format: json
    fields:
      - name: sections
        label: الأقسام
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: اسم القسم
            description: يطلع في القائمة فوق وعنوان صفحة القسم. تقدر تغيّره وقت ما تبي.
            type: string
            required: true
          - name: id
            label: رابط القسم (اختياري)
            description: إذا تركته فاضي، ينكتب اسم القسم في الرابط. لا تغيّره بعد النشر عشان الروابط القديمة تبقى شغالة.
            type: string
          - name: label
            label: العنوان الصغير فوق الاسم (اختياري)
            description: "يطلع فوق اسم القسم بخط صغير. مثال: SPORTS"
            type: string
          - name: intro
            label: النبذة تحت العنوان (اختياري)
            type: text
          - name: colors
            label: ألوان صفحة القسم (اختياري)
            description: تنطبق على صفحة القسم وصفحات مشاريعه. اتركها على "نفس ألوان الموقع" إذا ما تبي تغيّر.
            type: object
            fields:
              - name: theme
                label: نمط الألوان
                type: select
                options:
                  values:
                    - name: inherit
                      label: نفس ألوان الموقع
                    - name: dark
                      label: داكن (الأصلي)
                    - name: light
                      label: فاتح
                    - name: sand
                      label: رملي
                    - name: navy
                      label: كحلي
                    - name: olive
                      label: زيتوني
              - name: bg
                label: لون الخلفية (اختياري)
                description: "كود اللون، مثال: #0e0f10"
                type: string
              - name: fg
                label: لون النص (اختياري)
                description: "مثال: #f1eee6"
                type: string
              - name: muted
                label: لون النص الثانوي (اختياري)
                description: "مثال: #9b988f"
                type: string
          - name: projects
            label: مشاريع القسم
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title}"
            fields:
              - name: title
                label: اسم المشروع
                type: string
                required: true
              - name: id
                label: رابط المشروع (اختياري)
                description: إذا تركته فاضي، ينكتب اسم المشروع في الرابط. لا تغيّره بعد النشر عشان الروابط القديمة تبقى شغالة.
                type: string
              - name: subtitle
                label: سطر تعريفي (اختياري)
                type: string
              - name: location
                label: المكان
                type: string
              - name: year
                label: السنة (اختياري)
                type: string
              - name: featured
                label: يظهر في الصفحة الرئيسية
                type: boolean
              - name: cover
                label: صورة الغلاف
                description: تنقص مربع في صفحة القسم، وتطلع كاملة فوق في صفحة المشروع. أي قياس ينفع.
                type: image
                required: true
                options:
                  path: site/images/projects
              - name: coverPosition
                label: موضع الغلاف داخل المربع (اختياري)
                description: "استخدمه إذا المربع قاطع الوجه. 50% 50% = الوسط، 80% 50% = يميل لليمين، 20% 50% = لليسار، 50% 20% = لفوق."
                type: string
              - name: description
                label: الوصف
                description: كل سطر جديد = فقرة جديدة.
                type: text
              - name: colors
                label: ألوان صفحة المشروع (اختياري)
                description: اتركها على "نفس ألوان القسم" إذا ما تبي تغيّر.
                type: object
                fields:
                  - name: theme
                    label: نمط الألوان
                    type: select
                    options:
                      values:
                        - name: inherit
                          label: نفس ألوان القسم
                        - name: dark
                          label: داكن (الأصلي)
                        - name: light
                          label: فاتح
                        - name: sand
                          label: رملي
                        - name: navy
                          label: كحلي
                        - name: olive
                          label: زيتوني
                  - name: bg
                    label: لون الخلفية (اختياري)
                    description: "كود اللون، مثال: #0e0f10"
                    type: string
                  - name: fg
                    label: لون النص (اختياري)
                    description: "مثال: #f1eee6"
                    type: string
                  - name: muted
                    label: لون النص الثانوي (اختياري)
                    description: "مثال: #9b988f"
                    type: string
              - name: photos
                label: صور المشروع
                description: تقدر ترفع أكثر من صورة مرة وحدة. أي قياس ينفع، والموقع يصغّر الكبيرة لحاله.
                type: image
                options:
                  multiple: true
                  path: site/images/projects

  # ---------------------------------------------------------------
  - name: site
    label: نصوص الموقع
    description: الصفحة الرئيسية، نبذة عني، وبيانات التواصل.
    type: file
    path: site/content/site.json
    format: json
    fields:
      - name: hero
        label: الصفحة الرئيسية
        type: object
        fields:
          - name: title
            label: الاسم الكبير
            description: كل سطر هنا = سطر في العنوان.
            type: text
          - name: role
            label: المسمى
            type: string
          - name: lead
            label: الجملة التعريفية
            type: text
          - name: photo
            label: الصورة الشخصية
            type: image
            options:
              path: site/images

      - name: colors
        label: ألوان الموقع كله
        description: الأساس لكل الصفحات. أي صفحة أو قسم أو مشروع تقدر تعطيه ألوان خاصة تغطي عليه.
        type: object
        fields:
          - name: theme
            label: نمط الألوان
            type: select
            options:
              values:
                - name: dark
                  label: داكن (الأصلي)
                - name: light
                  label: فاتح
                - name: sand
                  label: رملي
                - name: navy
                  label: كحلي
                - name: olive
                  label: زيتوني
          - name: bg
            label: لون الخلفية (اختياري)
            description: "كود اللون، مثال: #0e0f10"
            type: string
          - name: fg
            label: لون النص (اختياري)
            description: "مثال: #f1eee6"
            type: string
          - name: muted
            label: لون النص الثانوي (اختياري)
            description: "مثال: #9b988f"
            type: string

      - name: pageColors
        label: ألوان كل صفحة
        description: كل صفحة تقدر تعطيها ألوان خاصة. ألوان الأقسام والمشاريع تلقاها داخل كل قسم ومشروع في "الأقسام والمشاريع".
        type: object
        fields:
          - name: home
            label: الصفحة الرئيسية
            description: اتركها على "نفس ألوان الموقع" إذا ما تبي تغيّر.
            type: object
            fields:
              - name: theme
                label: نمط الألوان
                type: select
                options:
                  values:
                    - name: inherit
                      label: نفس ألوان الموقع
                    - name: dark
                      label: داكن (الأصلي)
                    - name: light
                      label: فاتح
                    - name: sand
                      label: رملي
                    - name: navy
                      label: كحلي
                    - name: olive
                      label: زيتوني
              - name: bg
                label: لون الخلفية (اختياري)
                description: "كود اللون، مثال: #0e0f10"
                type: string
              - name: fg
                label: لون النص (اختياري)
                description: "مثال: #f1eee6"
                type: string
              - name: muted
                label: لون النص الثانوي (اختياري)
                description: "مثال: #9b988f"
                type: string
          - name: about
            label: صفحة نبذة عني
            description: اتركها على "نفس ألوان الموقع" إذا ما تبي تغيّر.
            type: object
            fields:
              - name: theme
                label: نمط الألوان
                type: select
                options:
                  values:
                    - name: inherit
                      label: نفس ألوان الموقع
                    - name: dark
                      label: داكن (الأصلي)
                    - name: light
                      label: فاتح
                    - name: sand
                      label: رملي
                    - name: navy
                      label: كحلي
                    - name: olive
                      label: زيتوني
              - name: bg
                label: لون الخلفية (اختياري)
                description: "كود اللون، مثال: #0e0f10"
                type: string
              - name: fg
                label: لون النص (اختياري)
                description: "مثال: #f1eee6"
                type: string
              - name: muted
                label: لون النص الثانوي (اختياري)
                description: "مثال: #9b988f"
                type: string
          - name: contact
            label: صفحة تواصل معي
            description: اتركها على "نفس ألوان الموقع" إذا ما تبي تغيّر.
            type: object
            fields:
              - name: theme
                label: نمط الألوان
                type: select
                options:
                  values:
                    - name: inherit
                      label: نفس ألوان الموقع
                    - name: dark
                      label: داكن (الأصلي)
                    - name: light
                      label: فاتح
                    - name: sand
                      label: رملي
                    - name: navy
                      label: كحلي
                    - name: olive
                      label: زيتوني
              - name: bg
                label: لون الخلفية (اختياري)
                description: "كود اللون، مثال: #0e0f10"
                type: string
              - name: fg
                label: لون النص (اختياري)
                description: "مثال: #f1eee6"
                type: string
              - name: muted
                label: لون النص الثانوي (اختياري)
                description: "مثال: #9b988f"
                type: string

      - name: featured
        label: المشاريع المختارة (في الرئيسية)
        description: "تختار المشاريع اللي تطلع هنا من داخل كل مشروع: فعّل \"يظهر في الصفحة الرئيسية\"."
        type: object
        fields:
          - name: label
            label: العنوان الصغير (اختياري)
            type: string
          - name: title
            label: العنوان
            type: string

      - name: about
        label: نبذة عني
        type: object
        fields:
          - name: lead
            label: الفقرة الأولى (بخط أكبر)
            type: text
          - name: body
            label: باقي النبذة
            description: كل سطر جديد = فقرة جديدة.
            type: text
          - name: facts
            label: الأرقام
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{fields.value}"
            fields:
              - name: value
                label: الرقم
                description: "مثال: +6 سنوات"
                type: string
              - name: text
                label: الوصف تحته
                type: string
          - name: tags
            label: الوسوم
            type: string
            list: true
          - name: photo
            label: الصورة
            type: image
            options:
              path: site/images

      - name: contact
        label: تواصل معي
        description: البريد و LinkedIn يتغيّرون في كل الموقع (حتى أسفل الصفحات).
        type: object
        fields:
          - name: title
            label: العنوان
            type: string
          - name: intro
            label: الجملة تحت العنوان
            type: text
          - name: email
            label: البريد
            type: string
          - name: phone
            label: الجوال / واتساب
            description: "اكتبه مع مفتاح الدولة، مثال: +966 54 235 5887 (رابط واتساب يتسوّى منه تلقائيًا). اتركه فاضي إذا ما تبيه يظهر."
            type: string
          - name: linkedin
            label: رابط LinkedIn
            type: string
          - name: location
            label: الموقع
            type: string
