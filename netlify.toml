# ==================================================================
# إعدادات النشر على Netlify
# Netlify يقرأ هذا الملف من GitHub، وينشر الموقع بعد كل حفظ من لوحة التحكم.
# ==================================================================

[build]
  # مجلد الموقع اللي ينرفع
  publish = "site"
  # يصغّر الصور الكبيرة في النسخة المنشورة (الأصل يبقى في GitHub).
  # لو فشل لأي سبب، النشر يكمل عادي بدون تصغير.
  command = "pip install pillow && python .github/scripts/shrink_images.py site || echo 'image shrink skipped'"
